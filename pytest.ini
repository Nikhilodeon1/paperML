[pytest]
testpaths = tests
# Slow tests are the ones that solve ODEs or load a cohort from its archive. They are excluded by
# default so the suite stays usable as a feedback loop, and run explicitly before a gate:
#   python -m pytest -m slow
markers =
    slow: takes more than about ten seconds (ODE solves, cohort loading, subprocess runs)
    needs_data: requires a dataset under the resolved data root
filterwarnings =
    # The existing engine declares float32 state and upcasts under x64; the values are correct and
    # the Phase 1 engine variants fix the declaration. Recorded in REPORTS/phase0.md.
    ignore:scatter inputs have incompatible types:FutureWarning
